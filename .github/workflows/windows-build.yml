name: Build KINOJO Meter Windows

concurrency:
  group: kinojo-meter-${{ github.ref }}
  cancel-in-progress: false

'on':
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'setup/**'
      - 'assets/**'
      - 'release/version.json'
      - 'tests/KINOJO.Meter.DecoderTests/**'
      - 'scripts/build-windows.ps1'
      - 'scripts/prepare-github-release.ps1'
      - 'scripts/publish-github-release.ps1'
      - 'scripts/sync-server-release.ps1'
      - 'BUILD_WINDOWS_RELEASE.cmd'
      - 'KINOJO.Meter.sln'
      - 'README.md'
      - '.github/workflows/windows-build.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'setup/**'
      - 'assets/**'
      - 'release/version.json'
      - 'tests/KINOJO.Meter.DecoderTests/**'
      - 'scripts/build-windows.ps1'
      - 'scripts/prepare-github-release.ps1'
      - 'scripts/publish-github-release.ps1'
      - 'scripts/sync-server-release.ps1'
      - 'BUILD_WINDOWS_RELEASE.cmd'
      - 'KINOJO.Meter.sln'
      - 'README.md'
      - '.github/workflows/windows-build.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Read release version
        id: release
        shell: pwsh
        run: |
          $manifest = Get-Content ./release/version.json -Raw | ConvertFrom-Json
          "version=$($manifest.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Parse release PowerShell scripts
        shell: pwsh
        run: |
          $issues = @()
          foreach ($path in @(
            './scripts/build-windows.ps1',
            './scripts/prepare-github-release.ps1',
            './scripts/publish-github-release.ps1',
            './scripts/sync-server-release.ps1'
          )) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            foreach ($parseError in @($parseErrors)) {
              $issues += "$path [$($parseError.Extent.StartLineNumber):$($parseError.Extent.StartColumnNumber)] $($parseError.Message)"
            }
          }
          if ($issues.Count -gt 0) { throw ($issues -join "`n") }
      - name: Preflight build inputs
        shell: powershell
        run: ./scripts/build-windows.ps1 -Configuration Release -PreflightOnly
      - name: Build and run decoder regression tests
        shell: pwsh
        run: |
          msbuild ./tests/KINOJO.Meter.DecoderTests/KINOJO.Meter.DecoderTests.csproj /restore /t:Build /p:Configuration=Release /p:Platform=x64 /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./tests/KINOJO.Meter.DecoderTests/bin/x64/Release/net48/KINOJO.Meter.DecoderTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build application, payload and installer
        shell: powershell
        run: ./scripts/build-windows.ps1 -Configuration Release
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KINOJO-Meter-${{ steps.release.outputs.version }}-Windows
          if-no-files-found: error
          path: |
            build/KinojoMeterPayload_${{ steps.release.outputs.version }}.zip
            build/KINOJO_Meter_${{ steps.release.outputs.version }}_Setup.exe
            build/checksums_${{ steps.release.outputs.version }}.txt

  release-check:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.version-change.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect release version change
        id: version-change
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ ! "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          elif ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- release/version.json; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi

  publish:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.release-check.outputs.publish == 'true'
    needs: [build, release-check]
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read release version
        id: release
        shell: pwsh
        run: |
          $manifest = Get-Content ./release/version.json -Raw | ConvertFrom-Json
          "version=$($manifest.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Download verified Windows build
        uses: actions/download-artifact@v4
        with:
          name: KINOJO-Meter-${{ steps.release.outputs.version }}-Windows
          path: build
      - name: Publish and remotely verify GitHub Release
        id: publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./scripts/publish-github-release.ps1
          -GitHubOwner '${{ github.repository_owner }}'
          -GitHubRepository '${{ github.event.repository.name }}'
          -ExpectedCommit '${{ github.sha }}'
      - name: Synchronize verified release to Server Master
        shell: pwsh
        run: >-
          ./scripts/sync-server-release.ps1
          -Endpoint 'https://josvoltpktvwysrasffq.supabase.co/functions/v1/meter-release-sync'
          -ExpectedCommit '${{ github.sha }}'
      - name: Preserve verified release registration
        uses: actions/upload-artifact@v4
        with:
          name: KINOJO-Meter-${{ steps.release.outputs.version }}-Release-Registration
          if-no-files-found: error
          path: build/release/KINOJO_Meter_${{ steps.release.outputs.version }}_release-registration.json
