name: Build KINOJO Meter Launcher

concurrency:
  group: kinojo-meter-launcher-${{ github.ref }}
  cancel-in-progress: false

'on':
  workflow_dispatch:
    inputs:
      target_channel:
        description: '발행 대상 채널'
        required: true
        default: stable
        type: choice
        options: [stable, staging]
      confirm_publish:
        description: 'PUBLISH_STAGING_LAUNCHER_<version> 또는 PUBLISH_LAUNCHER_<version>'
        required: false
        type: string
      execution_pool:
        description: '실행 Runner (무료 시간 부족 시 승인된 임시 자체 호스팅 Runner 사용)'
        required: true
        default: hosted
        type: choice
        options: [hosted, self-hosted]
  pull_request:
    paths:
      - 'launcher/**'
      - 'launcher-setup/**'
      - 'tests/KINOJO.Meter.Launcher.Tests/**'
      - 'contracts/**'
      - 'release/launcher-version.json'
      - 'release/launcher-staging-version.json'
      - 'scripts/build-launcher.ps1'
      - 'scripts/publish-launcher-release.ps1'
      - 'scripts/sync-launcher-release.ps1'
      - 'scripts/test-stage84-launcher-staging-release-boundary.py'
      - 'scripts/test-stable-default-channel-policy.py'
      - 'scripts/verify-distribution-boundary.ps1'
      - '.github/workflows/launcher-build.yml'
      - 'KINOJO.Meter.sln'
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - 'launcher-setup/**'
      - 'tests/KINOJO.Meter.Launcher.Tests/**'
      - 'contracts/**'
      - 'release/launcher-version.json'
      - 'release/launcher-staging-version.json'
      - 'scripts/build-launcher.ps1'
      - 'scripts/publish-launcher-release.ps1'
      - 'scripts/sync-launcher-release.ps1'
      - 'scripts/test-stage84-launcher-staging-release-boundary.py'
      - 'scripts/test-stable-default-channel-policy.py'
      - 'scripts/verify-distribution-boundary.ps1'
      - '.github/workflows/launcher-build.yml'
      - 'KINOJO.Meter.sln'

jobs:
  build:
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.target_channel == 'staging' && inputs.execution_pool == 'self-hosted' && '["self-hosted","Windows","X64","kinojo-public-launcher-release"]' || '["windows-latest"]') }}
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.target_channel == 'staging' && '["staging"]' || '["stable"]') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Read Launcher version
        id: release
        shell: pwsh
        run: |
          $manifestPath = if ('${{ matrix.channel }}' -eq 'staging') { './release/launcher-staging-version.json' } else { './release/launcher-version.json' }
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          "version=$($manifest.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact_name=$($manifest.artifactName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $checksum = if ('${{ matrix.channel }}' -eq 'staging') { "checksums_launcher_staging_$($manifest.version).txt" } else { "checksums_launcher_$($manifest.version).txt" }
          "checksum_name=$checksum" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $app = if ('${{ matrix.channel }}' -eq 'staging') { 'KINOJO.Meter.Launcher.Staging.exe' } else { 'KINOJO.Meter.Launcher.exe' }
          "app_name=$app" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $artifact = if ('${{ matrix.channel }}' -eq 'staging') { "KINOJO-Meter-Launcher-Staging-$($manifest.version)" } else { "KINOJO-Meter-Launcher-$($manifest.version)" }
          "workflow_artifact=$artifact" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Parse Launcher PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($path in @(
            './scripts/build-launcher.ps1',
            './scripts/publish-launcher-release.ps1',
            './scripts/sync-launcher-release.ps1',
            './scripts/verify-distribution-boundary.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if (@($errors).Count -gt 0) { throw "$path`n$(@($errors) -join "`n")" }
          }
      - name: Verify public/private distribution boundary
        shell: pwsh
        run: ./scripts/verify-distribution-boundary.ps1
      - name: Verify Stage 8-4 immutable STAGING publication boundary
        shell: pwsh
        run: python ./scripts/test-stage84-launcher-staging-release-boundary.py
      - name: Verify Stable-default channel policy
        shell: pwsh
        run: python ./scripts/test-stable-default-channel-policy.py
      - name: Build public Launcher only
        shell: pwsh
        run: ./scripts/build-launcher.ps1 -Configuration Release -Channel '${{ matrix.channel }}'
      - name: Run Launcher package boundary tests
        shell: pwsh
        run: |
          msbuild ./tests/KINOJO.Meter.Launcher.Tests/KINOJO.Meter.Launcher.Tests.csproj /restore /m /t:Build /p:Configuration=Release /p:Platform=x64 /p:LauncherChannel='${{ matrix.channel }}' /p:OutDir="$env:GITHUB_WORKSPACE\artifacts\launcher-tests-${{ matrix.channel }}\" /nologo
          if ($LASTEXITCODE -ne 0) { throw 'Launcher package test build failed.' }
          & "$env:GITHUB_WORKSPACE\artifacts\launcher-tests-${{ matrix.channel }}\KINOJO.Meter.Launcher.Tests.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Launcher package tests failed.' }
      - name: Reject embedded Core payload
        shell: pwsh
        run: |
          $launcher = Get-Item "./build/${{ steps.release.outputs.artifact_name }}"
          if ($launcher.Length -gt 10485760) { throw 'Public Launcher exceeds the 10 MiB boundary.' }
          if (Test-Path './build/KinojoMeterCore_*.zip') { throw 'Private Core artifact must never exist in the public Launcher build.' }
      - name: Upload Launcher verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.workflow_artifact }}
          if-no-files-found: error
          path: |
            build/${{ steps.release.outputs.artifact_name }}
            build/${{ steps.release.outputs.checksum_name }}
            build/launcher-app-${{ matrix.channel }}/${{ steps.release.outputs.app_name }}

  cutover-gate:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.target_channel == 'staging' && inputs.execution_pool == 'self-hosted' && '["self-hosted","Windows","X64","kinojo-public-launcher-release"]' || '["ubuntu-latest"]') }}
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      channel: ${{ steps.gate.outputs.channel }}
      version: ${{ steps.gate.outputs.version }}
      workflow_artifact: ${{ steps.gate.outputs.workflow_artifact }}
      environment: ${{ steps.gate.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Require explicit ACTIVE cutover and version change
        id: gate
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          TARGET_CHANNEL: ${{ inputs.target_channel }}
          CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
        run: |
          channel='stable'
          manifest='release/launcher-version.json'
          expected_state='ACTIVE'
          environment='meter-launcher-production'
          artifact_prefix='KINOJO-Meter-Launcher'
          if [[ "${{ github.event_name }}" == 'workflow_dispatch' && "$TARGET_CHANNEL" == 'staging' ]]; then
            channel='staging'
            manifest='release/launcher-staging-version.json'
            expected_state='STAGING_E2E'
            environment='meter-launcher-staging'
            artifact_prefix='KINOJO-Meter-Launcher-Staging'
          fi
          version="$(python -c "import json; print(json.load(open('$manifest', encoding='utf-8'))['version'])")"
          state="$(python -c "import json; print(json.load(open('$manifest', encoding='utf-8'))['cutoverState'])")"
          publish=false
          if [[ "${{ github.event_name }}" == 'workflow_dispatch' ]]; then
            expected="PUBLISH_LAUNCHER_${version}"
            [[ "$channel" == 'staging' ]] && expected="PUBLISH_STAGING_LAUNCHER_${version}"
            [[ "$state" == "$expected_state" && "$CONFIRM_PUBLISH" == "$expected" ]] && publish=true
          elif [[ "$state" == 'ACTIVE' && "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] &&
               git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null &&
               ! git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- release/launcher-version.json; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "workflow_artifact=${artifact_prefix}-${version}" >> "$GITHUB_OUTPUT"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"

  publish:
    if: needs.cutover-gate.outputs.publish == 'true'
    needs: [build, cutover-gate]
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.target_channel == 'staging' && inputs.execution_pool == 'self-hosted' && '["self-hosted","Windows","X64","kinojo-public-launcher-release"]' || '["windows-2025"]') }}
    environment: ${{ needs.cutover-gate.outputs.environment }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Read Launcher release
        id: release
        shell: pwsh
        run: |
          $manifestPath = if ('${{ needs.cutover-gate.outputs.channel }}' -eq 'staging') { './release/launcher-staging-version.json' } else { './release/launcher-version.json' }
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          "version=$($manifest.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.cutover-gate.outputs.workflow_artifact }}
          path: build
      - name: Publish immutable unsigned hobby Launcher release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./scripts/publish-launcher-release.ps1
          -GitHubOwner '${{ github.repository_owner }}'
          -GitHubRepository '${{ github.event.repository.name }}'
          -ExpectedCommit '${{ github.sha }}'
          -Channel '${{ needs.cutover-gate.outputs.channel }}'
      - name: Synchronize unsigned hobby Launcher to Server Master
        shell: pwsh
        run: >-
          ./scripts/sync-launcher-release.ps1
          -Endpoint 'https://josvoltpktvwysrasffq.supabase.co/functions/v1/meter-release-sync'
          -ExpectedCommit '${{ github.sha }}'
          -Channel '${{ needs.cutover-gate.outputs.channel }}'
