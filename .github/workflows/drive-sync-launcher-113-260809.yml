name: Prepare Launcher 1.1.3 Drive sync artifact

'on':
  push:
    branches:
      - ops/drive-sync-launcher-113-260809
    paths:
      - '.github/workflows/drive-sync-launcher-113-260809.yml'

permissions:
  contents: read

jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-artifact@v4
        with:
          name: drive-sync-launcher-113
          retention-days: 1
          if-no-files-found: error
          path: |
            launcher/LauncherModels.cs
            launcher/LauncherApiClient.cs
            launcher/LauncherForm.cs
            launcher/CoreUpdateHandoffMode.cs
            tests/KINOJO.Meter.Launcher.Tests/Program.cs
            release/launcher-staging-version.json
