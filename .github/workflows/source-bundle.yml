name: Prepare temporary source bundle

'on':
  push:
    branches: ['phase3-4/update-handoff-overlay-260809']
    paths: ['.github/workflows/source-bundle.yml']

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create source archive
        shell: bash
        run: zip -qr source-bundle.zip . -x '.git/*' 'source-bundle.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: kinojo-meter-source
          path: source-bundle.zip
          retention-days: 1
