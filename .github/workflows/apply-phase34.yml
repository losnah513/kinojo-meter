name: Apply Phase 3 Launcher payload

'on':
  push:
    branches: ['phase3-4/update-handoff-overlay-260809']
    paths: ['.github/workflows/apply-phase34.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase3-4/update-handoff-overlay-260809
      - name: Apply verified source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .phase34-payload/*.b64 | base64 -d > /tmp/phase34.zip
          echo '03b15d1dd72e7013e3aa2caa295c5ebc4ecd20d14ae187718efa36947e44ba12  /tmp/phase34.zip' | sha256sum -c -
          unzip -oq /tmp/phase34.zip -d .
          rm -rf .phase34-payload
          rm -f .github/workflows/source-bundle.yml .github/workflows/apply-phase34.yml
          git diff --check
          git config user.name 'KINOJO Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Phase 3: add hidden one-shot Core update handoff'
          git push origin HEAD:phase3-4/update-handoff-overlay-260809
