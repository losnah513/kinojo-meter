name: Module active bundle atomic boundary

on:
  pull_request:
    paths:
      - 'launcher/ModuleBundleActivator.cs'
      - 'launcher/ModuleBundleServerPointer.cs'
      - 'launcher/ModuleStagingSelfTest.cs'
      - 'launcher/ModuleStagingInstaller.cs'
      - 'launcher/ModulePackageVerifier.cs'
      - 'launcher/LauncherPaths.cs'
      - 'launcher/KINOJO.Meter.Launcher.csproj'
      - 'tests/KINOJO.Meter.ModuleBundleActivatorTests/**'
      - 'scripts/test-module-active-bundle-boundary.py'
      - '.github/workflows/module-active-bundle-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'launcher/ModuleBundleActivator.cs'
      - 'launcher/ModuleBundleServerPointer.cs'
      - 'launcher/ModuleStagingSelfTest.cs'
      - 'launcher/ModuleStagingInstaller.cs'
      - 'launcher/ModulePackageVerifier.cs'
      - 'launcher/LauncherPaths.cs'
      - 'launcher/KINOJO.Meter.Launcher.csproj'
      - 'tests/KINOJO.Meter.ModuleBundleActivatorTests/**'
      - 'scripts/test-module-active-bundle-boundary.py'
      - '.github/workflows/module-active-bundle-boundary.yml'
  workflow_dispatch:

jobs:
  static-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test-module-download-cache-boundary.py
      - run: python scripts/test-module-package-verifier-boundary.py
      - run: python scripts/test-module-staging-installer-boundary.py
      - run: python scripts/test-module-staging-self-test-boundary.py
      - run: python scripts/test-module-active-bundle-boundary.py

  windows-self-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build stable Launcher with atomic Bundle activator
        shell: pwsh
        run: |
          msbuild ./launcher/KINOJO.Meter.Launcher.csproj /restore /t:Build /p:Configuration=Release /p:Platform=x64 /p:LauncherVersion=1.1.5 /p:LauncherFileVersion=1.1.5.0 /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build staging Launcher with atomic Bundle activator
        shell: pwsh
        run: |
          msbuild ./launcher/KINOJO.Meter.Launcher.csproj /restore /t:Build /p:Configuration=Release /p:Platform=x64 /p:LauncherChannel=staging /p:LauncherVersion=1.1.3 /p:LauncherFileVersion=1.1.3.0 /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and run atomic Bundle activation suite
        shell: pwsh
        run: |
          msbuild ./tests/KINOJO.Meter.ModuleBundleActivatorTests/KINOJO.Meter.ModuleBundleActivatorTests.csproj /restore /t:Build /p:Configuration=Release /p:Platform=x64 /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./tests/KINOJO.Meter.ModuleBundleActivatorTests/bin/x64/Release/net48/KINOJO.Meter.ModuleBundleActivatorTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
