name: Temporary finalize Launcher UI asset ownership

on:
  push:
    branches:
      - agent/launcher-shared-ui-assets-cleanup-1.1.6

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[launcher-ui-assets-cleanup-116]') }}
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Wait for Launcher 1.1.6 shared-asset source
        shell: pwsh
        run: |
          $ready = $false
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            git fetch origin main --prune
            $source = git show origin/main:launcher/SharedUiAssetInstaller.cs 2>$null
            if ($source -match 'LAUNCHER_SHARED_UI_ASSETS') { $ready = $true; break }
            Write-Host "Launcher shared-asset source not ready (attempt $attempt/30); waiting 20 seconds"
            Start-Sleep -Seconds 20
          }
          if (-not $ready) { throw 'Launcher shared UI asset source did not reach main' }
          git reset --hard origin/main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Remove migrated UI files from installed Core slot after verified copy
        shell: python
        run: |
          from pathlib import Path

          path = Path('launcher/SharedUiAssetInstaller.cs')
          text = path.read_text(encoding='utf-8-sig')
          call = 'PurgeMigratedCoreAssets(coreSlotRoot);'
          if call not in text:
              anchor = 'Directory.Move(staging, sharedRoot);'
              if anchor not in text:
                  raise SystemExit('shared asset current-swap anchor was not found')
              text = text.replace(anchor, anchor + '\n                          ' + call, 1)

          if 'private static void PurgeMigratedCoreAssets' not in text:
              insertion = text.rfind('    }\n}')
              if insertion < 0:
                  raise SystemExit('SharedUiAssetInstaller class close was not found')
              method = r'''

                  private static void PurgeMigratedCoreAssets(string coreSlotRoot)
                  {
                      foreach (var relative in new[] { Path.Combine("assets", "fonts"), Path.Combine("assets", "icons") })
                      {
                          try
                          {
                              var target = Path.GetFullPath(Path.Combine(coreSlotRoot, relative));
                              var allowed = Path.GetFullPath(coreSlotRoot).TrimEnd(Path.DirectorySeparatorChar) + Path.DirectorySeparatorChar;
                              if (target.StartsWith(allowed, StringComparison.OrdinalIgnoreCase) && Directory.Exists(target))
                                  Directory.Delete(target, true);
                          }
                          catch
                          {
                              // A locked legacy file may remain duplicated. The verified
                              // Launcher shared cache remains authoritative; retry on the
                              // next successful Core installation instead of breaking launch.
                          }
                      }
                  }
          '''
              text = text[:insertion] + method + text[insertion:]
          path.write_text(text, encoding='utf-8', newline='\n')

          print('Launcher Core-slot UI asset cleanup added')
      - name: Build Launcher
        shell: pwsh
        run: |
          $solution = Get-ChildItem -Path . -Filter '*.sln' -Recurse | Select-Object -First 1
          if ($null -eq $solution) { throw 'Launcher solution not found' }
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($msbuild)) { throw 'MSBuild not found' }
          & $msbuild $solution.FullName /restore /t:Build /p:Configuration=Release /p:Platform=x64 /p:RestoreIgnoreFailedSources=true /m
          if ($LASTEXITCODE -ne 0) {
            & $msbuild $solution.FullName /restore /t:Build /p:Configuration=Release /p:RestoreIgnoreFailedSources=true /m
          }
          if ($LASTEXITCODE -ne 0) { throw "Launcher build failed: $LASTEXITCODE" }
      - name: Remove workflow and commit
        shell: pwsh
        run: |
          Remove-Item .github/workflows/shared-ui-assets-cleanup-116-temp.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: finalize Launcher ownership of UI asset files [launcher-ui-assets-cleanup-116]"
          git push --force-with-lease origin "HEAD:${env:GITHUB_REF_NAME}"
      - name: Open and merge cleanup PR
        shell: pwsh
        run: |
          $url = gh pr list --repo $env:GITHUB_REPOSITORY --head $env:GITHUB_REF_NAME --state open --json url --jq '.[0].url'
          if ([string]::IsNullOrWhiteSpace($url)) {
            $url = gh pr create --repo $env:GITHUB_REPOSITORY --base main --head $env:GITHUB_REF_NAME --title "refactor: finalize Launcher ownership of UI asset files" --body "After a SHA-verified atomic copy into Launcher-owned `shared-ui-assets/current`, removes loose font/icon copies from the installed Core slot. A locked legacy file is retried on the next successful installation rather than blocking launch. No release is dispatched."
          }
          gh pr merge $url --repo $env:GITHUB_REPOSITORY --admin --squash --delete-branch
          if ($LASTEXITCODE -ne 0) { throw 'Launcher UI asset cleanup PR merge failed' }
