name: Temporary Launcher 1.1.1 Progress Fix
on:
  push:
    branches:
      - agent/launcher-1.1.1-progress-complete
    paths:
      - '.github/tmp-launcher-progress-111.py'
      - '.github/workflows/tmp-launcher-progress-111.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/launcher-1.1.1-progress-complete
      - name: Apply Launcher 1.1.1 patch
        run: python .github/tmp-launcher-progress-111.py
      - name: Remove temporary patch files
        run: rm .github/tmp-launcher-progress-111.py .github/workflows/tmp-launcher-progress-111.yml
      - name: Commit product changes
        run: |
          git config user.name 'losnah513'
          git config user.email 'losnah513@gmail.com'
          git add -A
          git commit -m 'fix: finalize Launcher progress at 100 percent'
          git push origin HEAD:agent/launcher-1.1.1-progress-complete
