name: Capture individual update boundary

on:
  workflow_dispatch:
    inputs:
      target_channel:
        description: '검증 대상 채널'
        required: true
        default: stable
        type: choice
        options: [stable, staging]
  pull_request:
    paths:
      - 'launcher/LauncherPaths.cs'
      - 'launcher/LauncherModels.cs'
      - 'launcher/LauncherApiClient.cs'
      - 'launcher/LauncherForm.cs'
      - 'launcher/CoreUpdateHandoffMode.cs'
      - 'launcher/ModulePackageVerifier.cs'
      - 'launcher/PrivateRuntimePackageUpdater.cs'
      - 'launcher/CaptureModuleUpdater.cs'
      - 'launcher/KINOJO.Meter.Launcher.csproj'
      - 'tests/KINOJO.Meter.Launcher.Tests/**'
      - 'scripts/test-capture-individual-update-boundary.py'
      - '.github/workflows/capture-individual-update-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'launcher/LauncherPaths.cs'
      - 'launcher/LauncherModels.cs'
      - 'launcher/LauncherApiClient.cs'
      - 'launcher/LauncherForm.cs'
      - 'launcher/CoreUpdateHandoffMode.cs'
      - 'launcher/ModulePackageVerifier.cs'
      - 'launcher/PrivateRuntimePackageUpdater.cs'
      - 'launcher/CaptureModuleUpdater.cs'
      - 'launcher/KINOJO.Meter.Launcher.csproj'
      - 'tests/KINOJO.Meter.Launcher.Tests/**'
      - 'scripts/test-capture-individual-update-boundary.py'
      - '.github/workflows/capture-individual-update-boundary.yml'

jobs:
  boundary:
    runs-on: windows-latest
    strategy:
      matrix:
        channel: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.target_channel == 'staging' && '["staging"]' || '["stable"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test-capture-individual-update-boundary.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and run Launcher regression tests
        shell: pwsh
        run: |
          dotnet build tests/KINOJO.Meter.Launcher.Tests/KINOJO.Meter.Launcher.Tests.csproj -c Release -p:LauncherChannel=${{ matrix.channel }}
          & tests/KINOJO.Meter.Launcher.Tests/bin/Release/net48/KINOJO.Meter.Launcher.Tests.exe
